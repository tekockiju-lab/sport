<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>СПОРТ</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="СПОРТ"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a6b5f"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, bottom tab bar, exercise rows separated by hairlines (no card stack). Tokens first. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --fg:#10282a; --muted:#587172; --line:#d3dcdb;
  --accent:#0a6b5f; --accent-fg:#ffffff; --soft:#dff0ec;
  --warn:#8f4f00; --warn-bg:#fbefdc; --bad:#b3261e; --good:#12703a;
  --f-display:'Fira Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1819; --surface:#122427; --fg:#e4eeed; --muted:#8fa9a8; --line:#25403f;
    --accent:#46c2ad; --accent-fg:#06211d; --soft:#173a37;
    --warn:#f0b35c; --warn-bg:#33270f; --bad:#ff8a80; --good:#6fd39a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1819; --surface:#122427; --fg:#e4eeed; --muted:#8fa9a8; --line:#25403f;
  --accent:#46c2ad; --accent-fg:#06211d; --soft:#173a37;
  --warn:#f0b35c; --warn-bg:#33270f; --bad:#ff8a80; --good:#6fd39a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.day .nx{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.day.on .nx{color:var(--accent-fg)}
.optline{margin:18px 0 0;padding:8px 12px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600;border-radius:6px}
.ssTag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-right:6px}
.wtl{font-size:12.5px;color:var(--muted);margin-top:3px}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.times div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.times b{display:block;font-family:var(--f-display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.tmnote{font-size:13px;color:var(--muted);margin:0 0 14px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 150px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 14px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:34px;line-height:1;letter-spacing:.04em}
.status{font-size:12px;color:var(--muted);text-align:right;min-height:16px}
.vis{grid-column:1/-1;display:flex;gap:6px;margin:10px 0 6px}.vis figure{margin:0;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 4px 3px;display:flex;flex-direction:column}.vis figure.m{flex:1.35}.vis .vf{flex:1;display:flex;align-items:center}.vis svg{width:100%;height:auto;display:block}.vis figcaption{font-size:10.5px;line-height:1.2;text-align:center;color:var(--muted);padding-top:2px}.vis .sk,.vis .sa{fill:none;stroke:var(--fg);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}.vis .sa{stroke:var(--accent)}.vis .hd{fill:var(--surface);stroke:var(--fg);stroke-width:3}.vis .fl{stroke:var(--line);stroke-width:1.5}.vis .bn{fill:var(--line);stroke:var(--line);stroke-width:3;stroke-linecap:round}.vis .rl{stroke:var(--line);stroke-width:2}.vis .eq{fill:var(--muted);stroke:var(--fg)}.vis .eq2{stroke:var(--muted);stroke-width:3;stroke-linecap:round}.vis .cb{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 2}.vis .ar{stroke:#d83a30;stroke-width:2.2}.vis .arh{fill:#d83a30}.vis .bm{fill:var(--line)}.vis .mp{fill:#d83a30}.vis .ms{fill:#f2a59f}.vis .mt{font-size:9px;text-anchor:middle;fill:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}.day.wk{padding:8px 4px}.day.wk b{font-size:15px;font-family:var(--f-body,inherit);font-weight:700}.wtheme{margin:0 0 10px;font-size:13px;color:var(--muted);text-align:center}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.day b{font-family:var(--f-display);font-size:22px;line-height:1}
.day span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day.on span{color:var(--accent-fg);opacity:.85}
.banner{background:var(--soft);padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner .lab{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:4px;color:var(--accent)}
.title h2{font-size:26px;line-height:1.1}
.title p{margin:4px 0 14px;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fields input,.fields select{height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 8px;min-width:0;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 4px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg button.on.disc{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg button.on.pain{background:var(--bad);color:#fff;border-color:var(--bad)}
.shmsg{margin:8px 0 0;font-size:13px;color:var(--warn)}
.sec{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 14px;margin-bottom:6px}
details.fold>summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:14px}
details.fold ul{margin:0 0 12px;padding-left:18px}
details.fold li{margin:3px 0}
.ex{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 10px;padding:16px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exn{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.exh{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px}
.thumb{width:76px;height:78px;border-radius:6px;background:#eef0f0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mapth{background:var(--surface);border:1px solid var(--line)}.mapth svg{width:100%;height:100%;display:block}.mapth .mt{display:none}.mapth .bm{fill:var(--line)}.mapth .mp{fill:#d83a30}.mapth .ms{fill:#f2a59f}
.noimg{font-size:11px;text-align:center;color:#587172;padding:4px;font-weight:600}
.role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.exh h3{font-size:19px;line-height:1.15;margin:2px 0 4px}
.scheme{font-variant-numeric:tabular-nums;font-size:14px}
.scheme b{font-family:var(--f-display);font-size:18px}
.hint{grid-column:1/-1;margin-top:10px;font-size:13px;color:var(--muted)}
.hint.good{color:var(--good)} .hint.warn{color:var(--warn)}
.sets{grid-column:1/-1;margin-top:10px}
.sh,.sr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 44px;gap:8px;align-items:center}
.sh{font-size:11px;color:var(--muted);margin-bottom:4px}
.sr{margin-bottom:6px}
.sn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.sr input{height:44px;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 8px;font-variant-numeric:tabular-nums;font-size:16px}
.sr input::placeholder{color:var(--muted);opacity:.6}
.chk{height:44px;width:44px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}
.chk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.exact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
details.tech{grid-column:1/-1;margin-top:6px}
details.tech>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}
.techbody{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px;font-size:13.5px;margin-top:6px}
.techbody img{width:100%;border-radius:6px;background:#eef0f0}
.techbody dl{margin:0}
.techbody dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:600}
.techbody dt:first-child{margin-top:0}
.techbody dd{margin:2px 0 0}
@media (max-width:420px){.techbody{grid-template-columns:1fr}.techbody img{max-width:180px}}
.cardio{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.cardio h3{font-size:18px;margin-bottom:4px}
.cardio p{margin:0 0 8px;font-size:13.5px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
textarea.note{width:100%;min-height:76px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px;resize:vertical}
.rec{font-size:13px;color:var(--muted);margin:8px 0 0}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.hist>summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
.hist>summary::-webkit-details-marker{display:none}
.hist h3{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.histbody{padding:0 14px 12px;font-size:13.5px}
.histbody p{margin:6px 0}
.histbody b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;font-weight:600}
td{padding:8px 4px;border-top:1px solid var(--line)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:18px 0;font-size:14px}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad);height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .dot{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart text.v{fill:var(--fg);font-weight:600}
.rules h3{font-size:19px;margin:20px 0 6px}
.rules p,.rules li{font-size:14.5px}
.rules ul,.rules ol{padding-left:20px;margin:6px 0}
.rules li{margin:5px 0}
#copyBox{width:100%;min-height:150px;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:12px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#nav .in{max-width:640px;margin:0 auto}
#timer{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-weight:600}
#timer .t{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:6px 10px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabs button{border:0;background:none;padding:10px 2px;font-size:13px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer}
.tabs button.on{color:var(--accent-fg);background:var(--accent)}
</style>
<style>html{background:var(--bg);color-scheme:light dark}html,body{overscroll-behavior-y:none}body{padding-top:calc(10px + env(safe-area-inset-top,0px))}#nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}</style></head><body>

<div class="wrap">
  <header class="top">
    <div><div class="kicker">DDX Октябрьская · Красноярск</div><h1>СПОРТ</h1></div>

  <main id="view"><div class="banner"><span class="lab">Страница не запустилась</span>Предпросмотр файлов в Telegram не выполняет скрипты. Открой ссылку из чата с Claude в приложении Claude или в обычном браузере (Safari, Chrome).</div></main>
</div>
<nav id="nav"><div class="in">

    <button type="button" data-tab="body">Замеры</button>
    <button type="button" data-tab="rules">Правила</button>
  </div>
</div></nav>

/* ───────── Иллюстрации: схема движения (старт / финиш) и карта мышц ───────── */
const VZ={};
VZ.ik=function(p0,p2,a,b,side){
  const dx=p2[0]-p0[0],dy=p2[1]-p0[1];let d=Math.hypot(dx,dy)||1;d=Math.min(d,a+b-0.01);
  const ux=dx/Math.hypot(dx,dy||1e-9)||0,uy=dy/(Math.hypot(dx,dy)||1);
  const x=(a*a-b*b+d*d)/(2*d),h=Math.sqrt(Math.max(a*a-x*x,0));
  return [p0[0]+ux*x+side*h*(-uy),p0[1]+uy*x+side*h*ux];
};
VZ.pl=function(pts,cls,w){return '<polyline class="'+cls+'" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"'+(w?' style="stroke-width:'+w+'"':'')+'/>';};
VZ.arrow=function(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),s=5;
  return '<line class="ar" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/><polygon class="arh" points="'+x2+','+y2+' '+(x2-s*Math.cos(a-0.5)).toFixed(1)+','+(y2-s*Math.sin(a-0.5)).toFixed(1)+' '+(x2-s*Math.cos(a+0.5)).toFixed(1)+','+(y2-s*Math.sin(a+0.5)).toFixed(1)+'"/>';
};
VZ.eq=function(kind,w){
  if(kind==='bar')return '<circle class="eq" cx="'+w[0]+'" cy="'+w[1]+'" r="4.5"/>';
  if(kind==='db')return '<rect class="eq" x="'+(w[0]-5)+'" y="'+(w[1]-3)+'" width="10" height="6" rx="1.5"/>';
  if(kind==='handle')return '<line class="eq2" x1="'+(w[0]-4)+'" y1="'+w[1]+'" x2="'+(w[0]+4)+'" y2="'+w[1]+'"/>';
  return '';
};
/* кадр бокового вида: H бедро, S плечо, A лодыжка, W запястье; k, e стороны изгиба колена и локтя */
VZ.side=function(f){
  const k=f.k==null?1:f.k,e=f.e==null?-1:f.e;
  let s='<line class="fl" x1="3" y1="'+(f.floor||97)+'" x2="117" y2="'+(f.floor||97)+'"/>'+(f.bg||'');
  const K=VZ.ik(f.H,f.A,24,24,k);
  s+=VZ.pl([f.H,K,f.A],'sk');
  const toe=f.toe?[f.A[0]+8,f.A[1]+(f.toe>0?5:0)]:[f.A[0]+8,f.A[1]];

};

/* Расчёт времени: подход считается как 1 мин вместе с записью, плюс отдых после подхода (или после пары) и 30 с на смену тренажёра */
function estimate(day){
  const ex=PLAN[day].ex, groups=[];
  ex.forEach(e=>{
    const g=e.ss?groups.find(x=>x.ss===e.ss):null;
    if(g){g.items.push(e);}else groups.push({ss:e.ss||null,items:[e],opt:!!e.opt});
  });
  let core=0,opt=0;
  groups.forEach(g=>{
    const rounds=Math.max(...g.items.map(e=>e.sets));
    const rest=Math.max(...g.items.map(e=>e.restSec||0))/60;
    const m=rounds*(g.items.length*1+rest)+0.5;
    if(g.opt)opt+=m;else core+=m;
  });
  return {core:Math.round(core),opt:Math.round(opt)};
}

//#logic-start
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
const logged=a=>(a||[]).filter(x=>x&&num(x.w)!==null&&num(x.r)!==null);
const fmtSets=(a,unit)=>logged(a).map(x=>x.w+'×'+x.r).join(', ')+(unit==='с'&&logged(a).length?' с':'');
function qualifies(a,e){const L=logged(a);if(L.length<e.sets)return false;return L.every(x=>num(x.r)>=e.hi&&(x.q===''||x.q==null||num(x.q)>=1));}
const volume=a=>logged(a).reduce((t,x)=>t+num(x.w)*num(x.r),0);
function hintFor(e,hist){
  if(!hist.length) return {tone:'plain',text:'Первая запись: подбери вес так, чтобы после последнего повтора оставалось 2 в запасе.'};
  const last=hist[0];
  let t='Прошлый раз: '+fmtSets(last.sets,e.unit)+'. ';
  let tone='plain';
  if(e.shoulder&&(last.shoulder==='disc'||last.shoulder==='pain')){return {tone:'warn',text:t+'Тогда плечо давало знать: начни на 10–20% легче и следи за ощущениями.'};}
  if(e.noProg) return {tone,text:t};
  const topW=a=>Math.max(...logged(a).map(x=>num(x.w)));
  const q0=qualifies(last.sets,e), q1=hist[1]?(qualifies(hist[1].sets,e)&&topW(hist[1].sets)===topW(last.sets)):false;
  if(q0&&q1){tone='good';t+='Два раза подряд верх диапазона во всех подходах: прибавь '+e.step+'.';}
  else if(q0){tone='good';t+='Верх диапазона достигнут. Повтори вес: если выйдет снова, прибавляем.';}
  else if(logged(last.sets).some(x=>num(x.r)<e.lo)){tone='warn';t+='Часть подходов ниже диапазона: оставь вес или сбрось на шаг, техника важнее.';}
  else t+='Цель: добавить повторение в самых слабых подходах, вес прежний.';
  if(hist.length>=3&&volume(hist[0].sets)>0&&volume(hist[0].sets)<=volume(hist[2].sets)){t+=' Три тренировки без роста объёма: проверь сон, питание и технику, при необходимости неделя разгрузки.';tone='warn';}
  return {tone,text:t};
}

/* ───────── Сохранение ───────── */
let pending=null,saveTimer=null,chain=Promise.resolve();
function setStatus(t){const el=$('#status');if(el)el.textContent=t;}
function scheduleSave(){
  S.touched=true;setStatus('Сохраняю…');
  pending={id:S.draft.id,data:JSON.parse(JSON.stringify(S.draft))};
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  clearTimeout(saveTimer);
  if(!pending)return;
  const p=pending;pending=null;
  chain=chain.then(()=>writeDoc('sessions',p.id,Object.assign(p.data,{updatedAt:Date.now()})));
}
async function writeDoc(col,id,data){
  try{
    if(S.db){await S.db.doc(col+'/'+id).set(data);}
    else{const m=col==='sessions'?S.sessions:S.body;m[id]=data;localSave(col);}
    setStatus(S.db?'Сохранено в журнал':'Сохранено на этом телефоне');
    if(!S.db){if(S.tab==='hist')renderHist();if(S.tab==='body')renderBody();}
  }catch(e){setStatus('Не сохранено: '+(e&&(e.message||e.code)||'ошибка'));}
}
async function deleteDoc(col,id){
  try{
    if(S.db){await S.db.doc(col+'/'+id).delete();}
    else{delete (col==='sessions'?S.sessions:S.body)[id];localSave(col);}
    if(!S.db){if(col==='sessions')renderHist();else renderBody();}
  }catch(e){setStatus('Не удалено: '+(e&&(e.message||e.code)||'ошибка'));}
}
function localSave(col){try{localStorage.setItem('ddx.'+col,JSON.stringify(col==='sessions'?S.sessions:S.body));}catch(e){}}
function localLoad(){
  try{S.sessions=JSON.parse(localStorage.getItem('ddx.sessions')||'{}')||{};S.body=JSON.parse(localStorage.getItem('ddx.body')||'{}')||{};}catch(e){S.sessions={};S.body={};}
}
async function initStore(){
  let db=null;
  try{db=(MODE!=='pwa'&&window.claude&&window.claude.use)?await window.claude.use('db'):null;}catch(e){db=null;}
  if(!db){
    localLoad();setStatus(MODE==='pwa'?'Работает без интернета · записи на этом телефоне':'Журнал не подключён: записи хранятся только на этом телефоне');
    S.loaded=true;if(!S.touched){if(!S.dayPicked)S.day=suggestNext();loadDraft();}render();return;
  }
  S.db=db;setStatus('Журнал подключён');
  const onErr=e=>setStatus('Журнал недоступен: '+(e&&(e.message||e.code)||'ошибка'));
  db.collection('sessions').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S.sessions=m;
    if(!S.loaded){S.loaded=true;if(!S.touched){if(!S.dayPicked)S.day=suggestNext();loadDraft();}render();}
    else{refreshHints();if(S.tab==='hist')renderHist();}
  },onErr);
  db.collection('body').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S.body=m;
    if(S.tab==='body')renderBody();
  },onErr);
}

function sessionLines(s,withZero){
  const out=[];
  (PLAN[s.day]?PLAN[s.day].ex:[]).forEach(e=>{
    const a=s.sets&&s.sets[e.id];if(!logged(a).length)return;
    const rirs=logged(a).map(x=>x.q).filter(q=>q!==''&&q!=null);
    out.push([e.name,fmtSets(a,e.unit)+(rirs.length?' (запас '+rirs.join('/')+')':'')]);
  });
  return out;
}

/* ───────── Вкладка «Замеры» ───────── */
function chartSVG(pts,unit){
  if(pts.length<2)return '';
  const W=320,H=120,pl=36,pr=14,pt=14,pb=22;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*0.2;mn-=pad;mx+=pad;
  const X=i=>pl+(W-pl-pr)*i/(pts.length-1),Y=y=>pt+(H-pt-pb)*(1-(y-mn)/(mx-mn));
  const f=v=>(Math.round(v*10)/10).toString().replace('.',',');
  const mid=(mn+mx)/2;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динамика, '+esc(unit)+'">';
  [mn,mid,mx].forEach(v=>{s+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+f(v)+'</text>';});
  s+='<polyline class="ln" points="'+pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')+'"/>';
  const L=pts.length-1;
  s+='<circle class="dot" cx="'+X(L)+'" cy="'+Y(pts[L].y)+'" r="4"/><text class="v" x="'+X(L)+'" y="'+(Y(pts[L].y)-8)+'" text-anchor="end">'+f(pts[L].y)+'</text>';
  s+='<text x="'+pl+'" y="'+(H-6)+'">'+esc(fmt(pts[0].x))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmt(pts[L].x))+'</text></svg>';
  return s;
}
function renderBody(){
  const list=Object.values(S.body).filter(b=>b&&b.date).sort((a,b)=>a.date<b.date?1:-1);
  const asc=list.slice().reverse();
  const series=k=>asc.filter(b=>num(b[k])!==null).map(b=>({x:b.date,y:num(b[k])}));
  const dl=(k,u)=>{const s=series(k);return s.length>=2?(()=>{const v=Math.round((s[s.length-1].y-s[0].y)*10)/10;return (v>0?'+':'')+String(v).replace('.',',')+' '+u+' с первой записи';})():'';};
  let h='<div class="title"><h2>Замеры</h2><p>Вес, талия, процент жира. Измеряй в одинаковых условиях: утром, натощак, после туалета.</p></div>'
   +'<div class="panel"><div class="fields">'
   +'<label>Дата<input type="date" id="bDate" value="'+esc(iso(new Date()))+'"></label>'
   +'<label>Вес, кг<input type="text" inputmode="decimal" id="bW" placeholder="—"></label>'
   +'<label>Талия, см<input type="text" inputmode="decimal" id="bT" placeholder="—"></label>'
   +'<label>Жир, %<input type="text" inputmode="decimal" id="bF" placeholder="—"></label></div>'
   +'<p class="rec">Талия: рулетка на уровне пупка, утром, на выдохе, без втягивания живота. Процент жира с биоимпеданса клуба показывает динамику, но с погрешностью в несколько процентов.</p>'
   +'<div class="row"><button type="button" class="btn" data-act="savebody">Записать замер</button></div></div>';
  if(!list.length){h+='<p class="empty">Замеров пока нет. Внеси результаты анализа тела из клуба и обхват талии, это точка отсчёта.</p>';$('#view').innerHTML=h;return;}
  [['waist','Талия, см','см','bT'],['weight','Вес, кг','кг','bW']].forEach(([k,t,u])=>{
    const key=k==='waist'?'t':'w';
    const pts=asc.filter(b=>num(b[key])!==null).map(b=>({x:b.date,y:num(b[key])}));
    if(pts.length>=2)h+='<div class="sec">'+t+'</div>'+chartSVG(pts,u)+'<p class="rec">'+esc(dl(key,u))+'</p>';
  });
  h+='<div class="sec">Записи</div><div class="scroll"><table><tr><th>Дата</th><th>Вес</th><th>Талия</th><th>Жир</th><th></th></tr>'
   +list.map(b=>'<tr><td>'+esc(fmt(b.date))+'</td><td>'+esc(b.w||'—')+'</td><td>'+esc(b.t||'—')+'</td><td>'+esc(b.f||'—')+'</td><td><button type="button" class="link" data-act="delbody" data-id="'+esc(b.date)+'">убрать</button></td></tr>').join('')+'</table></div>';
  $('#view').innerHTML=h;
}

/* ───────── Вкладка «Правила» ───────── */
function renderRules(){
  $('#view').innerHTML='<div class="title"><h2>Правила</h2><p>Как писать вес, прогрессировать и когда останавливаться</p></div><div class="rules">'
  +'<h3>Как писать вес</h3><ul>'
  +'<li><b>Гантели:</b> вес одной гантели. Если в каждой руке по 14 кг, пиши 14.</li>'
  +'<li><b>Смит:</b> гриф (15 кг) плюс блины, всё вместе. 15 + 60 пиши как 75.</li>'
  +'<li><b>EZ-гриф:</b> вместе с блинами.</li>'
  +'<li><b>Блочные тренажёры:</b> цифра на плитке стека.</li>'
  +'<li><b>Рычажные с блинами и жим ногами:</b> блины суммарно с обеих сторон.</li>'
  +'<li>Главное писать одинаково каждый раз: тогда прогресс виден.</li></ul>'
  +'<h3>Если не хватает времени</h3><ul><li>Упражнения стоят по важности. Пропускай блок «Если останется время», потом кардио.</li>'
  +'<li>Основные подходы не режь: сократи отдых между подходами до 90 с.</li>'
  +'<li>Суперсет значит: сделал подход первого упражнения, сразу подход второго, и только потом отдых.</li>'
  +'<li>Ориентир: в зал вошёл, через 60 минут выходишь. Если три тренировки подряд не успеваешь основную часть, пиши тренеру: уберём ещё подходы.</li></ul>'
  +'<h3>Если день сорвался</h3><ul><li>Приложение предлагает следующую тренировку по кругу: 3 недели по три дня (Верх A, Низ, Верх B), потом снова с недели 1. Пропуск ничего не сбивает, просто идёшь дальше. Любую тренировку можно выбрать вручную: сверху недели, под ними дни.</li>'
  +'<li>Три тренировки в неделю достаточно. Можно сдвигать на вторник, четверг или выходной.</li>'
  +'<li>Между тренировками по возможности один день отдыха. Верх A и Верх B подряд не ставь.</li></ul>'
  +'<h3>Как устроен цикл на 3 недели</h3><ul><li>Расписание остаётся тем же: Верх A, Низ, Верх B. Каждую неделю часть упражнений меняется, чтобы нагружать мышцы под разными углами.</li><li>Основные упражнения (смит, жимы, присед, жим ногами) возвращаются через неделю или две. Вес и повторения подтягиваются из прошлых записей даже если упражнение было на другой неделе.</li><li>Если неделя вышла тяжёлой (сон, работа, усталость), на следующей тренировке сделай 2 подхода вместо 3 в вспомогательных упражнениях и продолжай цикл.</li></ul><h3>Прогрессия нагрузки</h3><ol>'
  +'<li>У каждого упражнения есть диапазон повторений, например 8–10.</li>'
  +'<li>Пока верх диапазона не достигнут во всех подходах с запасом 1–2 повтора, вес не меняется. Растут повторения.</li>'
  +'<li>Две тренировки подряд верх диапазона во всех подходах: прибавь вес (смит +2,5 кг, гантели +2 кг, стек на один шаг).</li>'
  +'<li>После прибавки повторения упадут к нижней границе. Это нормально.</li>'
  +'<li>Вес не повышается на каждой тренировке и не повышается, если страдает техника.</li></ol>'
  +'<h3>Запас повторений</h3><p>«Запас» значит, сколько повторений ты мог бы сделать ещё. Рабочие подходы заканчивай с запасом 1–2. До отказа можно идти только в последнем подходе изоляции.</p>'
  +'<h3>Плечо</h3><ul><li>Острая или простреливающая боль, или боль, что остаётся после подхода: стоп, снижай вес или бери замену.</li>'
  +'<li>Тупое жжение в работающей мышце: норма.</li>'
  +'<li>Разминка плеча (ротация и тяга к лицу) обязательна перед жимами.</li>'
  +'<li>Если боль повторяется или нарастает, покажись ортопеду или травматологу и сделай УЗИ плеча.</li></ul>'
  +'<h3>Сушка</h3><ul><li>Кардио в зале добавляет немного: 10 минут ходьбы в горку это порядка 70–100 ккал. Решают питание и шаги.</li>'
  +'<li>Белок в каждом приёме пищи: мясо, рыба, яйца, творог. Ориентир 140–170 г в сутки.</li>'
  +'<li>После тренировки блюдо с явным источником белка, каша и блины гарниром. Алкоголь один вечер в выходные.</li>'
  +'<li>В дни без зала прогулка 30–40 минут.</li>'
  +'<li>Вес и талию записывай на вкладке «Замеры». Если за 2–3 недели вес не идёт вниз, убираем около 200–300 ккал в день.</li></ul>'
  +'<h3>Сон и сауна</h3><ul><li>Цель 7–8 часов. Самый дешёвый рычаг: лечь в 22:00–22:30.</li>'
  +'<li>Сауна и хамам не сжигают жир, но восстановление не мешают. Пей воду после. Хочешь выкроить время: 10 минут вместо 15 дают лишний блок в зале.</li></ul>'
  +'<h3>Тревожные симптомы</h3><p>Боль в груди, обморок, сильная необычная одышка: прекращай тренировку и обращайся за срочной медицинской помощью.</p></div>';
}

/* ───────── Рендер и события ───────── */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(!S.draft)loadDraft();
  if(S.tab==='train')renderTrain();else if(S.tab==='hist')renderHist();else if(S.tab==='body')renderBody();else renderRules();
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;flush();render();window.scrollTo(0,0);}));

function switchTo(day,date){flush();S.day=day;S.date=date;S.dayPicked=true;loadDraft();renderTrain();}
const view=$('#view');
view.addEventListener('input',e=>{
  const t=e.target;if(!S.draft)return;
  if(t.dataset.f){S.draft.sets[t.dataset.ex][+t.dataset.i][t.dataset.f]=t.value;scheduleSave();return;}
  if(t.dataset.sf){S.draft[t.dataset.sf]=t.value;scheduleSave();return;}
});
view.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fDate'&&t.value){switchTo(S.day,t.value);}
  if(t.id==='fCardio'){S.draft.cardio=t.checked;scheduleSave();}
});
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='day'){switchTo(b.dataset.d,S.date);}
  else if(a==='week'){switchTo(dayKey(+b.dataset.w,Math.max(0,slotOf(S.day))),S.date);}
  else if(a==='shoulder'){
    S.draft.shoulder=S.draft.shoulder===b.dataset.v?'':b.dataset.v;
    document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.draft.shoulder));
    $('#shMsg').textContent=shMsgText(S.draft.shoulder);scheduleSave();
  }
  else if(a==='done'){
    const e2=ALLEX[b.dataset.ex],s=S.draft.sets[b.dataset.ex][+b.dataset.i];
    s.d=s.d?0:1;b.classList.toggle('on',!!s.d);scheduleSave();
    if(s.d)startTimer(e2.restSec);
  }
  else if(a==='copyprev'){
    const e2=ALLEX[b.dataset.ex],prev=prevSessions(e2)[0];if(!prev)return;
    const ps=prev.sets[e2.id]||[];
    S.draft.sets[e2.id].forEach((s,i)=>{const p=ps[i];if(p&&p.w){s.w=p.w;s.r=p.r||'';}});
    document.querySelectorAll('[data-ex="'+e2.id+'"][data-f]').forEach(inp=>{const s=S.draft.sets[e2.id][+inp.dataset.i];if(inp.dataset.f==='w'||inp.dataset.f==='r')inp.value=s[inp.dataset.f];});
    scheduleSave();
  }
  else if(a==='delsess'){
    if(b.dataset.armed){deleteDoc('sessions',b.dataset.id);}
    else{b.dataset.armed='1';b.textContent='Нажми ещё раз для удаления';}
  }
  else if(a==='copyhist'){
    const text=histText();
    const show=()=>{$('#copyOut').innerHTML='<textarea id="copyBox" readonly></textarea>';const box=$('#copyBox');box.value=text;box.focus();box.select();};
    try{navigator.clipboard.writeText(text).then(()=>{$('#copyOut').innerHTML='<p class="rec">Скопировано. Вставь в чат с тренером.</p>';},show);}catch(err){show();}
  }
  else if(a==='exportall'){
    const text=JSON.stringify({v:1,sessions:S.sessions,body:S.body});
    const show=()=>{$('#exOut').innerHTML='<textarea id="copyBox" readonly></textarea>';const box=$('#copyBox');box.value=text;box.focus();box.select();};
    try{navigator.clipboard.writeText(text).then(()=>{$('#exOut').innerHTML='<p class="rec">Скопировано. Вставь в заметки.</p>';},show);}catch(err){show();}
  }
  else if(a==='importall'){
    (async()=>{
      const msg=$('#impMsg');
      try{
        const o=JSON.parse($('#impBox').value.trim());let n=0;
        for(const [id,doc] of Object.entries(o.sessions||{})){if(doc&&doc.date&&doc.day){await writeDoc('sessions',id,doc);n++;}}
        for(const [id,doc] of Object.entries(o.body||{})){if(doc&&doc.date){await writeDoc('body',id,doc);}}
        if(!S.touched){S.day=suggestNext();loadDraft();}
        if(MODE==='pwa')renderHist();
        const m2=$('#impMsg');if(m2)m2.textContent='Загружено тренировок: '+n;
      }catch(err){msg.textContent='Не удалось прочитать текст. Скопируй копию целиком, от первой { до последней }.';}
    })();
  }
  else if(a==='savebody'){
    const date=$('#bDate').value,w=$('#bW').value.trim(),t=$('#bT').value.trim(),f=$('#bF').value.trim();
    if(!date||(!w&&!t&&!f))return;
    const old=S.body[date]||{};
    const data={date:date,w:w||old.w||'',t:t||old.t||'',f:f||old.f||''};
    writeDoc('body',date,data).then(()=>{if(S.db)return;renderBody();});
  }
  else if(a==='delbody'){deleteDoc('body',b.dataset.id);}
});

/* Экран не гаснет в зале, если браузер разрешает */
let wake=null;
async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});
keepAwake();

if(MODE==='pwa'){
  try{if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
initDay();loadDraft();render();initStore();
</script>
